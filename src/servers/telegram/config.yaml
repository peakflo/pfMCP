name: "Telegram MCP Server"
description: "Send and manage Telegram messages as a bot (Telegram Bot API)"
documentation_path: "README.md"
tools:
  - name: "get_bot_info"
    description: "Get the connected bot's profile"
  - name: "get_chat"
    description: "Get details of a chat, group or channel the bot is in"
  - name: "get_chat_member_count"
    description: "Count the members of a group or channel"
  - name: "get_chat_administrators"
    description: "List the administrators of a group or channel"
  - name: "send_message"
    description: "Send a text message, optionally with inline URL buttons"
  - name: "send_document"
    description: "Send a file from a URL, a file_id or base64 content"
  - name: "send_photo"
    description: "Send a photo from a URL, a file_id or base64 content"
  - name: "edit_message_text"
    description: "Edit the text of a message the bot sent"
  - name: "delete_message"
    description: "Delete a message"
  - name: "forward_message"
    description: "Forward a message to another chat"
  - name: "copy_message"
    description: "Copy a message to another chat without the forward header"
  - name: "pin_chat_message"
    description: "Pin a message"
  - name: "unpin_chat_message"
    description: "Unpin a message"
  - name: "get_file"
    description: "Get metadata of a file by file_id"
  - name: "download_file"
    description: "Download a file (up to 20 MB) as base64"
  - name: "create_chat_invite_link"
    description: "Create an invite link for a group or channel"
