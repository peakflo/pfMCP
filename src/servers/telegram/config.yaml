name: "Telegram MCP Server"
description: "Read and send Telegram messages as a connected user account (Telethon)"
documentation_path: "README.md"
tools:
  - name: "get_me"
    description: "Get the connected account's profile"
  - name: "list_chats"
    description: "List chats (dialogs) with unread counts"
  - name: "get_chat"
    description: "Get details of a chat, group, channel or user"
  - name: "get_messages"
    description: "Get messages from a chat"
  - name: "search_messages"
    description: "Search messages in one chat or across all chats"
  - name: "send_message"
    description: "Send a text message"
  - name: "edit_message"
    description: "Edit a sent message"
  - name: "delete_messages"
    description: "Delete messages"
  - name: "forward_messages"
    description: "Forward messages to another chat"
  - name: "mark_as_read"
    description: "Mark a chat as read"
  - name: "list_contacts"
    description: "List contacts"
  - name: "get_user"
    description: "Get a user's profile"
  - name: "resolve_username"
    description: "Find the owner of a @username"
  - name: "get_participants"
    description: "List members of a group or channel"
