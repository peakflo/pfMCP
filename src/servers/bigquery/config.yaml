name: "Google BigQuery MCP Server"
description: "Explore BigQuery datasets and tables and run GoogleSQL queries"
documentation_path: "README.md"
tools:
  - name: "list_datasets"
    description: "List datasets in a Google Cloud project"
  - name: "list_tables"
    description: "List tables in a dataset"
  - name: "get_table"
    description: "Get table metadata and schema"
  - name: "run_query"
    description: "Run a GoogleSQL query with a billing limit"
  - name: "get_query_results"
    description: "Retrieve or page a query job's results"
