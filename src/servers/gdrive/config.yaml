name: "Google Drive guMCP Server"
icon: "assets/icon.png"
description: "Search and access files in Google Drive"
documentation_path: "README.md"
tools:
  - name: "search"
    description: "Search for files in Google Drive"
  - name: "list_files"
    description: "Browse files and folders with pagination and shared-drive support"
  - name: "read_file"
    description: "Read file contents or export Google documents"
  - name: "list_drives"
    description: "Discover accessible shared drives with pagination. Use a drive's ID as folder_id and drive_id in list_files."
  - name: "get_file_info"
    description: "Get file/folder metadata, parents, version, capabilities, links and shortcut target without downloading. Does not resolve shortcuts."
  - name: "list_permissions"
    description: "Inspect file/folder sharing and inherited permissions, including shared drives. Read-only; does not grant access."
  - name: "create_folder"
    description: "Create a folder in My Drive or a supplied parent folder, including shared drives. Requires write-capable OAuth grants."
  - name: "copy_file"
    description: "Copy a file, optionally with a new name and destination folder. Does not recursively copy folders. Requires write-capable OAuth grants."
  - name: "update_file"
    description: "Rename, change description, move to a folder, or trash/restore a file or folder. Operates on the supplied shortcut itself, not its target. Requires write-capable OAuth grants."
  - name: "upload_file"
    description: "Upload a new file from UTF-8 text or base64 bytes (exactly one). No local paths or remote URLs. Maximum 10 MiB. Optional conversion to a native Google document; requires write-capable OAuth grants."
  - name: "export_file"
    description: "Export a native Google file as PDF, DOCX, XLSX, PPTX, text or other supported MIME type. Returns an embedded binary resource. Maximum 10 MiB; does not change sharing."
  - name: "extract_file_text"
    description: "Extract text from PDF, DOCX, XLSX or PPTX; native Google files and text also supported. No OCR; encrypted PDFs and legacy DOC/XLS/PPT are unsupported. Paginated text, 10 MiB input limit."
